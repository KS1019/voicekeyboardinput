name: VoiceKeyboardInput
options:
  bundleIdPrefix: com.ks1019
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VoiceKeyboardPackage:
    path: Packages/VoiceKeyboardPackage
  SnapshotPreviews:
    url: https://github.com/getsentry/SnapshotPreviews
    exactVersion: 0.17.0
targets:
  VoiceKeyboardInput:
    type: application
    platform: iOS
    sources:
      - VoiceKeyboardInputApp
      - VoiceKeyboardAudioSupport
      - VoiceKeyboardUIKit
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardModels
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardSharedStorage
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardInterfaces
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardCommandPipeline
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardPresentation
      - target: VoiceKeyboardExtension
        embed: true
    info:
      path: VoiceKeyboardInputApp/Info.plist
      properties:
        CFBundleDisplayName: Voice Keyboard Input
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.ks1019.voicekeyboardinput
            CFBundleURLSchemes:
              - voicekeyboard
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Voice Keyboard Input uses the microphone only when you explicitly start voice input or microphone validation.
        NSSpeechRecognitionUsageDescription: Voice Keyboard Input uses speech recognition only after you explicitly start voice input. Audio may be processed by Apple to recognize speech, and recognized text is temporarily shared with the keyboard for insertion.
        UIBackgroundModes:
          - audio
    entitlements:
      path: VoiceKeyboardInputApp/VoiceKeyboardInput.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ks1019.voicekeyboardinput
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 47JGA6NAP2
        PRODUCT_BUNDLE_IDENTIFIER: com.ks1019.voicekeyboardinput
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_OBJC_BRIDGING_HEADER: VoiceKeyboardAudioSupport/VoiceKeyboardAudioExceptionGuard.h
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"

  VoiceKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      # Extension compiles shared UIKit directly under APPLICATION_EXTENSION_API_ONLY.
      # SwiftUI previews stay app/preview-only and must not enter the extension binary.
      - path: VoiceKeyboardUIKit
        excludes:
          - KeyboardRootViewPreview.swift
      - path: VoiceKeyboardExtension
        excludes:
          - DictationCapture.html
      - path: VoiceKeyboardExtension/DictationCapture.html
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardModels
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardSharedStorage
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardInterfaces
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardCore
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardPresentation
    info:
      path: VoiceKeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Voice Keyboard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: Voice Keyboard uses the microphone after you tap Speak to start voice input.
        NSSpeechRecognitionUsageDescription: Voice Keyboard uses Apple speech recognition to convert your voice input to text. Audio may be processed by Apple.
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: VoiceKeyboardExtension/VoiceKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ks1019.voicekeyboardinput
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 47JGA6NAP2
        PRODUCT_BUNDLE_IDENTIFIER: com.ks1019.voicekeyboardinput.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES

  VoiceKeyboardInputPreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoiceKeyboardInputPreviewTests
    dependencies:
      - target: VoiceKeyboardInput
      - package: SnapshotPreviews
        product: SnapshottingTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ks1019.voicekeyboardinput.previewtests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VoiceKeyboardInput.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VoiceKeyboardInput
        BUNDLE_LOADER: $(TEST_HOST)

  VoiceKeyboardUIKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoiceKeyboardUIKitTests
      - VoiceKeyboardExtension/WebKitDictationCapture.swift
      - path: VoiceKeyboardExtension/DictationCapture.html
        buildPhase: resources
    dependencies:
      - target: VoiceKeyboardInput
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ks1019.voicekeyboardinput.uikittests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VoiceKeyboardInput.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VoiceKeyboardInput
        BUNDLE_LOADER: $(TEST_HOST)

  VoiceKeyboardInputUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VoiceKeyboardInputUITests
    dependencies:
      - target: VoiceKeyboardInput
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ks1019.voicekeyboardinput.uitests
schemes:
  VoiceKeyboardInput:
    build:
      targets:
        VoiceKeyboardInput: all
        VoiceKeyboardExtension: all
        VoiceKeyboardInputPreviewTests: [test]
        VoiceKeyboardUIKitTests: [test]
        VoiceKeyboardInputUITests: [test]
    test:
      macroExpansion: VoiceKeyboardInput
      targets:
        - VoiceKeyboardInputPreviewTests
        - VoiceKeyboardUIKitTests
        - VoiceKeyboardInputUITests
      gatherCoverageData: false
      environmentVariables:
        SNAPSHOTS_RUNNING_FOR_PREVIEWS: "1"
    run:
      config: Debug
      executable: VoiceKeyboardInput
    profile:
      config: Release
      executable: VoiceKeyboardInput
