name: VoiceKeyboardMenuBar
options:
  bundleIdPrefix: com.ks1019
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VoiceKeyboardPackage:
    path: Packages/VoiceKeyboardPackage
targets:
  VoiceKeyboardMenuBar:
    type: application
    platform: macOS
    sources:
      - VoiceKeyboardMenuBar
    dependencies:
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardCommandPipeline
      - package: VoiceKeyboardPackage
        product: VoiceKeyboardModels
    info:
      path: VoiceKeyboardMenuBar/Info.plist
      properties:
        CFBundleDisplayName: Voice Keyboard Menu Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
    entitlements:
      path: VoiceKeyboardMenuBar/VoiceKeyboardMenuBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ks1019.voicekeyboardinput.menubar

  VoiceKeyboardMenuBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - VoiceKeyboardMenuBarTests
    dependencies:
      - target: VoiceKeyboardMenuBar
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: 13.0
        PRODUCT_BUNDLE_IDENTIFIER: com.ks1019.voicekeyboardinput.menubartests

schemes:
  VoiceKeyboardMenuBar:
    build:
      targets:
        VoiceKeyboardMenuBar: all
        VoiceKeyboardMenuBarTests: [test]
    test:
      targets:
        - VoiceKeyboardMenuBarTests
